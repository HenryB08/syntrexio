name: Deploy site to GitHub Pages

# Builds the app/ TanStack Start app into fully static HTML and deploys it to
# GitHub Pages on the syntrexio.com domain.
#
# SAFETY DURING MIGRATION (phases B through F):
#   The `deploy` job is double-gated: it runs only on main AND only when the repo
#   variable PAGES_DEPLOY_ENABLED == 'true'. So even after this lands on main,
#   merges just build green and skip deploy — the current branch-served live site
#   is never touched before the Phase G cutover.
#   Cutover (Phase G) = (1) set Pages source to "GitHub Actions" in repo Settings,
#   (2) set repo variable PAGES_DEPLOY_ENABLED = true. Both are one-time UI steps.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: app
        run: bun run build

      - name: Add Pages metadata (CNAME, .nojekyll, SPA 404 fallback)
        run: |
          set -eu
          OUT=app/dist/client
          # Custom domain: keep syntrexio.com bound to the Pages deployment.
          cp CNAME "$OUT/CNAME"
          # Disable Jekyll so files/dirs beginning with "_" are served as-is.
          touch "$OUT/.nojekyll"
          # SPA fallback: unknown paths boot the app so the router can resolve
          # client-side routes and render its own not-found page.
          cp "$OUT/index.html" "$OUT/404.html"
          echo "Artifact contents:" && ls -a "$OUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/client

  deploy:
    # Double gate, both required to deploy:
    #   1. main branch only (feature-branch / dispatch runs stop after build)
    #   2. repo variable PAGES_DEPLOY_ENABLED == 'true' — set this ONLY at the
    #      Phase G cutover, together with flipping Pages source to "GitHub
    #      Actions". Until then, main merges build green and skip deploy, so the
    #      current branch-served live site is never disturbed during B through F.
    if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
